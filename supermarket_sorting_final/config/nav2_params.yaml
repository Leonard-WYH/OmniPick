# 中文说明：Nav2 公共参数。每次启动都由 slam_toolbox 重新在线建图，
# 不使用 AMCL、map_server、地图保存器或历史地图。
# 时间单位约定：frequency/loop_rate 为 Hz；tolerance/sim_time 为秒；
# bt_loop_duration/default_server_timeout/wait_for_service_timeout 为毫秒。

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # 局部控制器每秒计算 10 次，即周期 0.1 s
    odom_topic: /nav2/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3  # 控制器临时算不出有效速度时最多容忍 0.3 s
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      # 20 s 内若底盘未移动至少 5 cm，判定导航无进展并触发恢复。
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05 #0.15
      movement_time_allowance: 20.0 #12.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.06

    # DWB
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.70 #0.75
      min_speed_xy: 0.0
      max_speed_xy: 0.28
      min_speed_theta: 0.05 #0.0
      acc_lim_x: 0.50 #0.40
      acc_lim_y: 0.0
      acc_lim_theta: 1.5 #1.20
      decel_lim_x: -0.60 #-0.50
      decel_lim_y: 0.0
      decel_lim_theta: -1.5 #-1.50
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 50 #30
      sim_time: 1.4 #1.7  # DWB 每条候选速度向前仿真的时间窗（秒），不是等待
      linear_granularity: 0.025 #0.05
      angular_granularity: 0.025
      transform_tolerance: 0.30  # DWB 接受的 TF 时间误差上限（秒）
      xy_goal_tolerance: 0.06
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.04
      PathAlign.scale: 18.0 #24.0
      PathAlign.forward_point_distance: 0.08 #0.10
      GoalAlign.scale: 14.0 #18.0
      GoalAlign.forward_point_distance: 0.08 #0.10
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0  # 全局规划器期望运算能力；不等于 BT 重规划频率
    # 恢复原来的 NavFn/Dijkstra 为默认 GridBased；现有两套行为树和
    # Nav2 默认行为树都请求这个 ID，因此各类商品和手动目标会
    # 统一切回原规划器。SmacPlanner2D 的完整试验配置保留为 SmacGrid。
    planner_plugins: [GridBased, SmacGrid]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.20
      use_astar: false
      allow_unknown: true

    # 上一轮使用的 SmacPlanner2D 配置原样保留；若以后还要对比，只需
    # 把行为树里的 planner_id 从 GridBased 改为 SmacGrid。
    SmacGrid:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # 必须小于 0.25 Hz 重规划周期（4 s），避免一次搜索占满下一周期。
      max_planning_time: 2.0
      # 3.0 让 Smac 明显拒绝贴着膨胀边走；原值 2.0 在随机障碍拐角处
      # 经常用很小的路程收益换取很高的贴边风险。窄道没有硬封死，确实
      # 只有一条可行通道时仍允许穿过软代价区。
      cost_travel_multiplier: 3.0 # 原值 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        # 减少平滑器在障碍拐角处把代价感知 A* 路径重新拉向内侧。
        w_smooth: 0.15 # 原值 0.30
        w_data: 0.30   # 原值 0.20
        tolerance: 1.0e-10
        do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0  # Spin/BackUp/Wait 等恢复行为的更新频率
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.30  # 恢复行为接受的 TF 时间误差上限（秒）
    simulate_ahead_time: 2.0  # 恢复动作向前碰撞预测的时间窗，不是原地等待
    max_rotational_vel: 0.75
    min_rotational_vel: 0.20
    rotational_acc_lim: 1.20

bt_navigator:
  ros__parameters:
    # BT 主循环和服务等待参数以下三项均为毫秒，不是秒。
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /nav2/odom
    default_nav_to_pose_bt_xml: /workspace/baseline/config/navigate_to_pose_w_replanning_and_recovery.xml
    transform_tolerance: 0.30  # BT 导航可接受的 TF 时间误差上限（秒）
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20  # 路点执行器检查频率；当前主任务主要使用 NavigateToPose
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0  # 局部障碍代价更新频率
      publish_frequency: 4.0  # 局部代价地图对外发布频率
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      # 6 m 滚动窗口给 0.65 m/s、3 s 的 MPPI 最远轨迹（1.95 m）
      # 留出约 1.05 m 的障碍/转弯余量；120×120 栅格仍可在 8 Hz 更新。
      width: 6
      height: 6
      resolution: 0.05
      # From the official Server MMK2 MJCF collision geometry.  Keep the
      # padding conservative; carried-arm clearance still NEEDS_TUNING.
      footprint: "[[0.219, 0.200], [0.219, -0.200], [-0.202, -0.200], [-0.202, 0.200]]"
      footprint_padding: 0.015 #0.03
      transform_tolerance: 0.30  # 局部代价地图接受的 TF 时间误差上限（秒）
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /slamware_ros_sdk_server_node/scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          obstacle_min_range: 0.0
          obstacle_max_range: 10.0
          raytrace_min_range: 0.0
          raytrace_max_range: 11.5
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 扩大可感知软缓冲并放慢代价衰减，使 MPPI 提前修正而不是等到
        # footprint 已贴住障碍才急停；膨胀区仍是软代价，不是硬障碍。
        inflation_radius: 0.30 # 原值 0.30
        cost_scaling_factor: 10.0 # 原值 10.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0  # 全局代价更新频率
      publish_frequency: 2.0  # 全局代价地图对外发布频率
      global_frame: map
      robot_base_frame: base_link
      # Keep a fixed-size planning horizon around the robot instead of letting
      # StaticLayer resize the master costmap to slam_toolbox's current /map.
      rolling_window: true
      # Humble declares width/height as integer parameters (units: metres).
      width: 20
      height: 20
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.219, 0.200], [0.219, -0.200], [-0.202, -0.200], [-0.202, 0.200]]"
      footprint_padding: 0.015 #0.03
      transform_tolerance: 0.30  # 全局代价地图接受的 TF 时间误差上限（秒）
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /slamware_ros_sdk_server_node/scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          obstacle_min_range: 0.0
          obstacle_max_range: 10.0
          raytrace_min_range: 0.0
          raytrace_max_range: 11.5
          max_obstacle_height: 2.0
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 与局部地图使用同一代价坡度，避免全局路径认为贴边很便宜、
        # 到局部控制器处才发现所有可采样轨迹都不可用。
        inflation_radius: 0.30 # 原值 0.30
        cost_scaling_factor: 10.0 # 原值 10.0
      always_send_full_costmap: true
